name: Control Plane CI

on:
  push:
    paths:
      - 'licensing/**'
      - '.github/workflows/control-plane-ci.yml'
  pull_request:
    paths:
      - 'licensing/**'
      - '.github/workflows/control-plane-ci.yml'

defaults:
  run:
    working-directory: licensing

jobs:
  build-test-package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: |
          dotnet restore src/Nyxveil.ControlPlane.Web/Nyxveil.ControlPlane.Web.csproj
          dotnet restore tests/Nyxveil.ControlPlane.UnitTests/Nyxveil.ControlPlane.UnitTests.csproj
          dotnet restore tests/Nyxveil.ControlPlane.IntegrationTests/Nyxveil.ControlPlane.IntegrationTests.csproj
          dotnet restore tests/Nyxveil.ControlPlane.BrowserE2E/Nyxveil.ControlPlane.BrowserE2E.csproj

      - name: Build Release
        run: |
          dotnet build src/Nyxveil.ControlPlane.Web/Nyxveil.ControlPlane.Web.csproj -c Release --no-restore
          dotnet build tests/Nyxveil.ControlPlane.UnitTests/Nyxveil.ControlPlane.UnitTests.csproj -c Release --no-restore
          dotnet build tests/Nyxveil.ControlPlane.IntegrationTests/Nyxveil.ControlPlane.IntegrationTests.csproj -c Release --no-restore
          dotnet build tests/Nyxveil.ControlPlane.BrowserE2E/Nyxveil.ControlPlane.BrowserE2E.csproj -c Release --no-restore

      - name: Unit tests
        run: dotnet test tests/Nyxveil.ControlPlane.UnitTests/Nyxveil.ControlPlane.UnitTests.csproj -c Release --no-build --logger "trx;LogFileName=control-plane-unit.trx"

      - name: Start SQL LocalDB
        shell: pwsh
        run: |
          sqllocaldb start MSSQLLocalDB
          sqllocaldb info MSSQLLocalDB

      - name: Integration tests (LocalDB)
        env:
          NYXVEIL_SQLTEST_SERVER: '(localdb)\MSSQLLocalDB'
        run: dotnet test tests/Nyxveil.ControlPlane.IntegrationTests/Nyxveil.ControlPlane.IntegrationTests.csproj -c Release --no-build --logger "trx;LogFileName=control-plane-integration.trx"

      - name: Install Playwright Chromium
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\Nyxveil.ControlPlane.BrowserE2E\bin\Release\net10.0\playwright.ps1 install chromium

      - name: Browser operator E2E
        run: dotnet test tests/Nyxveil.ControlPlane.BrowserE2E/Nyxveil.ControlPlane.BrowserE2E.csproj -c Release --no-build --logger "trx;LogFileName=control-plane-browser-e2e.trx"

      - name: Windows service CreateService integration
        # Use Windows PowerShell 5.1 to match LIVE production-deploy host semantics.
        # The test also re-probes the sc.exe 1639 quoting defect via powershell.exe explicitly.
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\scripts\test-windows-service-create.ps1
          # The script writes WINDOWS_SERVICE_CREATE_TEST=PASS on success.

      - name: Full operator lab gate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\scripts\full-operator-e2e.ps1 -GateMode lab
          if ($LASTEXITCODE -ne 0) { throw "full-operator-e2e lab failed: $LASTEXITCODE" }

      - name: Publish
        run: dotnet publish src/Nyxveil.ControlPlane.Web/Nyxveil.ControlPlane.Web.csproj -c Release -o artifacts/web

      - name: Production gate (local)
        shell: pwsh
        run: .\scripts\production-gate.ps1 -GateMode local

      - name: Pack release ZIP
        shell: pwsh
        run: .\scripts\pack-release.ps1 -PublishDir .\artifacts\web

      - name: Validate extracted package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = (Get-Content VERSION -Raw).Trim()
          $zip = Join-Path (Get-Location) ("Nyxveil-ControlPlane-v{0}-release.zip" -f $ver)
          if (-not (Test-Path -LiteralPath $zip)) { throw "missing $zip" }
          $extract = Join-Path $env:TEMP ("nyxveil-cp-ci-extract-" + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $extract | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
          $required = @(
            'VERSION',
            'publish\Nyxveil.ControlPlane.Web.dll',
            'publish\scripts\self-update-apply.ps1',
            'scripts\production-deploy.ps1',
            'scripts\production-gate.ps1',
            'scripts\Nyxveil.ControlPlane.Deploy.psm1',
            'scripts\self-update-apply.ps1',
            'scripts\test-windows-service-create.ps1',
            'database\migrations\005_certificate_operation_states.sql',
            'database\migrations\validate_schema_v5.sql',
            'docs\RELEASE-1.3.8.md',
            'docs\RELEASE-1.3.9.md',
            'release-manifest.json'
          )
          foreach ($rel in $required) {
            $p = Join-Path $extract $rel
            if (-not (Test-Path -LiteralPath $p)) { throw "extracted package missing $rel" }
          }
          $updaterDll = Join-Path $extract 'publish\updater\Nyxveil.ControlPlane.Updater.dll'
          $updaterExe = Join-Path $extract 'publish\updater\Nyxveil.ControlPlane.Updater.exe'
          if (-not ((Test-Path -LiteralPath $updaterDll) -or (Test-Path -LiteralPath $updaterExe))) {
            throw 'extracted package missing publish/updater/Nyxveil.ControlPlane.Updater.(dll|exe)'
          }
          if (Test-Path (Join-Path $extract 'ef-baseline.tmp.sql')) { throw 'package must not contain ef-baseline.tmp.sql' }
          if (Get-ChildItem -LiteralPath $extract -Recurse -Filter '*.trx' -ErrorAction SilentlyContinue) {
            throw 'package must not contain *.trx'
          }
          Push-Location $extract
          try {
            & .\scripts\production-gate.ps1 -GateMode local -PackageDir (Join-Path $extract 'publish')
          } finally {
            Pop-Location
          }
          Write-Host "EXTRACTED_PACKAGE_VALIDATION=PASS"

      - name: Upload release ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: control-plane-release-zip
          path: licensing/Nyxveil-ControlPlane-v*.zip
          if-no-files-found: error
