name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Format check
        # Protocol Core under ./core is Frozen (hash-locked via server THIRD_PARTY_CORE /
        # third_party/nvp). Do not rewrite it with gofmt. Server first-party formatting is
        # enforced by server-ci.yml. Root CI only guards other first-party trees if present.
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -name '*.go' \
            ! -path './core/*' \
            ! -path '*/third_party/*' \
            ! -path '*/dist/*' \
            ! -path '*/vendor/*' \
            ! -path './.git/*' \
            ! -path './clients/*' \
            ! -path './licensing/*' \
            ! -path './server/*' \
            | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Format check: no mutable first-party Go outside Frozen Core / server / clients"
            exit 0
          fi
          unfmt="$(gofmt -l "${files[@]}")"
          if [ -n "${unfmt}" ]; then
            echo "unformatted:"
            echo "${unfmt}"
            exit 1
          fi
      - name: Vet
        # Frozen Core windows package: !windows stub Factory lacks OpenFunc while
        # tun_test.go is untagged — Linux vet/test would rewrite/fail Core. Covered by
        # the windows job instead. Do not modify Frozen Core.
        run: |
          set -euo pipefail
          mapfile -t pkgs < <(go list ./core/... | grep -v '/platform/windows$')
          go vet "${pkgs[@]}"
      - name: Test
        run: |
          set -euo pipefail
          mapfile -t pkgs < <(go list ./core/... | grep -v '/platform/windows$')
          go test -timeout 120s "${pkgs[@]}"
      - name: Race test
        run: |
          set -euo pipefail
          mapfile -t pkgs < <(go list ./core/... | grep -v '/platform/windows$')
          go test -race -timeout 180s "${pkgs[@]}"
      - name: Benchmark smoke
        run: go test -bench=BenchmarkTicketVerify -benchtime=1s ./core/auth/ticket/
      - name: Fuzz smoke
        run: |
          go test -fuzz=FuzzDecodeWireRecord -fuzztime=10s ./core/packet/
          go test -fuzz=FuzzTicketVerify -fuzztime=10s ./core/auth/ticket/
          go test -fuzz=FuzzDecodeInner -fuzztime=10s ./core/packet/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build core commands
        run: go build -o /dev/null ./core/cmd/...

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Test Windows platform foundation
        run: go test ./core/platform/windows/...
