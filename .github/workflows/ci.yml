name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -timeout 120s ./...
      - name: Race test
        run: go test -race -timeout 180s ./integration/... ./replay/... ./auth/ticket/... ./controlplane/...
      - name: Benchmark smoke
        run: go test -bench=BenchmarkTicketVerify -benchtime=1s ./auth/ticket/
      - name: Fuzz smoke
        run: |
          go test -fuzz=FuzzDecodeWireRecord -fuzztime=10s ./packet/
          go test -fuzz=FuzzTicketVerify -fuzztime=10s ./auth/ticket/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build all commands
        run: go build -o /dev/null ./cmd/...
