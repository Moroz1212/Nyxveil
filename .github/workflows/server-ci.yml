name: Server CI

on:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/server-ci.yml'
      - '.github/workflows/server-release.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server-ci.yml'
      - '.github/workflows/server-release.yml'

defaults:
  run:
    working-directory: server

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: server/go.sum
      - name: Format check
        # Frozen Core under third_party/nvp is hash-locked — do not rewrite with gofmt.
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -name '*.go' ! -path './third_party/*' ! -path './dist/*' | sort)
          unfmt="$(gofmt -l "${files[@]}")"
          if [ -n "${unfmt}" ]; then
            echo "unformatted:"
            echo "${unfmt}"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -timeout 120s ./...
      - name: Server contract gates
        run: |
          set -euo pipefail
          log="$(mktemp)"
          trap 'rm -f "${log}"' EXIT
          bash scripts/full-operator-server-e2e.sh | tee "${log}"
          if grep -Eq '^SERVER_CONTRACT_GATES=(PARTIAL|FAIL)' "${log}"; then
            echo 'Server contract gates were not complete.'
            exit 1
          fi
          grep -qx 'SERVER_CONTRACT_GATES=PASS' "${log}"
          # Contract coverage is not full production operator E2E evidence.
      - name: Installer structure checks
        run: bash scripts/test-install.sh
      - name: Lifecycle-aware updater gate regression
        run: bash scripts/test-update-lifecycle-gate.sh
      - name: Platform modes and firewall transaction contracts
        run: |
          bash scripts/test-installed-modes.sh
          bash scripts/test-installer-management-assets.sh
          bash scripts/test-firewall-transaction.sh
      - name: Curl|bash self-contained installer mock
        run: bash scripts/test-curl-installer.sh
      - name: Manifest shell↔Go interop + curl pipe
        run: bash scripts/test-manifest-interop.sh
      - name: Linux permission / ownership regression
        run: bash scripts/test-linux-permissions.sh
      - name: Installer version resolution (semver MAX)
        run: bash scripts/test-installer-version-resolution.sh
      - name: Pinned release installer (DEFAULT_RELEASE_VERSION)
        run: bash scripts/test-pinned-release-installer.sh
      - name: Bounded runuser/timeout wrapper
        run: bash scripts/test-bounded-runuser-timeout.sh
      - name: ACME privileged bind / bootstrap secret hygiene
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables util-linux libcap2-bin python3
          # This fixture must not leak into later unprivileged Go tests: their
          # TLS fixtures cannot chown files to a different service account.
          # Preserve any account that existed before this step.
          if ! id nyxveil >/dev/null 2>&1; then
            sudo useradd --system --no-create-home --shell /usr/sbin/nologin nyxveil
            trap 'sudo timeout -k 2 10 userdel nyxveil || exit 1' EXIT
          fi
          sudo bash scripts/test-acme-privileged-bind.sh | tee /tmp/acme-bind-gate.log
          grep -qx 'ACME_PRIVILEGED_BIND=PASS' /tmp/acme-bind-gate.log
      - name: nftables idempotency
        run: |
          sudo bash scripts/test-nftables-idempotency.sh | tee /tmp/nft-gate.log
          grep -q '^NFTABLES_IDEMPOTENCY=PASS ' /tmp/nft-gate.log
      - name: Remote update gate API contract
        run: bash scripts/test-remote-update-gate-contract.sh
      - name: Remote certificate renewal gate contract
        run: bash scripts/test-remote-cert-renewal-gate-contract.sh
      - name: Bounded installer HTTP downloads
        run: bash scripts/test-bounded-http-get.sh
      - name: Clean-host gate contract (required management assets)
        run: bash scripts/test-clean-host-gate-contract.sh
      - name: Race tests (Linux)
        run: go test -race -timeout 300s ./internal/runtime ./internal/updater ./internal/listeners ./internal/netcfg

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: server/go.sum
      - name: Cross-compile amd64/arm64
        run: bash scripts/build-release.sh
      - name: Package release (unsigned manifests)
        run: bash scripts/package-release.sh
      - name: Verify release
        run: bash scripts/verify-release.sh
      - name: Verify artifact set (UPLOAD-LIST complete)
        run: bash scripts/verify-artifact-set.sh
      - name: Assert release bytes identity
        run: bash scripts/assert-release-bytes-identity.sh
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nyxveil-server-binaries
          # Canonical release directory with EVERY publishable file (flat + tarballs).
          path: server/dist/release/
