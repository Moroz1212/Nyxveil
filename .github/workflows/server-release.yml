name: Server Release

# Publishes EXACT bytes from a successful Server CI artifact for this commit.
# NEVER rebuilds binaries here (CI build A must equal published A).
#
# Order (artifact purity):
# 1) publish-candidate prerelease from CI bytes (needed so button E2E can download target)
# 2) production-release-e2e against published candidate
# 3) finalize: clear prerelease flag only after E2E PASS

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: "Optional Server CI run ID whose artifact to publish (default: latest success for this SHA)"
        required: false
        type: string
  push:
    tags:
      - 'server-v*'

defaults:
  run:
    working-directory: server

permissions:
  contents: write
  actions: read

jobs:
  publish-candidate:
    name: Publish candidate (prerelease) from Server CI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      release_tag: ${{ steps.publish.outputs.release_tag }}
      ci_run_id: ${{ steps.publish.outputs.ci_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: server/go.sum

      - name: Assert Frozen Core SHA
        run: bash scripts/assert-frozen-core.sh

      - name: Download canonical CI artifact (no rebuild)
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="server-v${VERSION}"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            [[ "${GITHUB_REF_NAME}" == "${TAG}" ]] || { echo "Tag disagrees with VERSION"; exit 1; }
          fi
          SHA="${GITHUB_SHA}"
          RUN_ID="${INPUT_RUN_ID:-}"
          if [[ -z "${RUN_ID}" ]]; then
            RUN_ID="$(gh run list --repo "${GITHUB_REPOSITORY}" \
              --workflow server-ci.yml --commit "${SHA}" --status success \
              --limit 1 --json databaseId -q '.[0].databaseId')"
          fi
          [[ -n "${RUN_ID}" && "${RUN_ID}" != "null" ]] || {
            echo "No successful Server CI run for commit ${SHA}"
            echo "Push the tag only after Server CI is green, or pass ci_run_id."
            exit 1
          }
          [[ "${RUN_ID}" =~ ^[0-9]+$ ]] || { echo "Invalid CI run ID"; exit 1; }
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" > /tmp/server-ci-run.json
          jq -e --arg sha "${SHA}" --arg repo "${GITHUB_REPOSITORY}" '
            .head_sha == $sha and .repository.full_name == $repo and
            .head_repository.full_name == $repo and .event == "push" and
            .path == ".github/workflows/server-ci.yml" and
            .status == "completed" and .conclusion == "success"
          ' /tmp/server-ci-run.json >/dev/null
          git fetch --force --no-tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
          [[ "$(git rev-parse "${TAG}^{commit}")" == "${SHA}" ]] || { echo "Tag targets another commit"; exit 1; }
          echo "Using verified Server CI run ${RUN_ID} for ${SHA}"
          rm -rf dist/release
          mkdir -p dist/release
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
            | jq -s '[.[].artifacts[] | select(.name == "nyxveil-server-binaries" and .expired == false)]' > /tmp/server-ci-artifacts.json
          jq -e 'length == 1' /tmp/server-ci-artifacts.json >/dev/null
          ARTIFACT_ID="$(jq -r '.[0].id' /tmp/server-ci-artifacts.json)"
          DIGEST="$(jq -r '.[0].digest' /tmp/server-ci-artifacts.json)"
          [[ "${DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "Missing artifact digest"; exit 1; }
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/server-ci-artifact.zip
          printf '%s  %s\n' "${DIGEST#sha256:}" /tmp/server-ci-artifact.zip | sha256sum -c -
          unzip -q /tmp/server-ci-artifact.zip -d dist/release
          chmod 0755 dist/release/{production-gate,install,bootstrap-cli-update,live-final-update}.sh
          printf 'Source: %s\nCI run: %s\nArtifact ID: %s\nArchive SHA256: %s\n' \
            "${SHA}" "${RUN_ID}" "${ARTIFACT_ID}" "${DIGEST#sha256:}" >> "${GITHUB_STEP_SUMMARY}"
          echo "CI_RUN_ID=${RUN_ID}" >> "${GITHUB_ENV}"
          echo "RELEASE_TAG=${TAG}" >> "${GITHUB_ENV}"
          echo "release_tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "ci_run_id=${RUN_ID}" >> "${GITHUB_OUTPUT}"

      - name: Verify release bytes identity (CI artifact)
        run: |
          set -euo pipefail
          bash scripts/verify-release.sh --ci-artifact
          bash scripts/verify-artifact-set.sh
          bash scripts/assert-release-bytes-identity.sh
          echo "RELEASE_BYTES_IDENTITY=PASS"

      - name: Create/verify GitHub release from CI bytes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="${RELEASE_TAG:-server-v${VERSION}}"
          DIST=dist/release
          UPLOAD_LIST="${DIST}/UPLOAD-LIST-server-v${VERSION}.txt"
          [[ -f "${UPLOAD_LIST}" ]] || { echo "missing ${UPLOAD_LIST}"; exit 1; }
          mapfile -t BASENAMES < "${UPLOAD_LIST}"
          ASSETS=()
          for name in "${BASENAMES[@]}"; do
            name="$(printf '%s' "${name}" | tr -d '\r')"
            [[ -n "${name}" && "${name}" == "$(basename "${name}")" ]] ||
              { echo "invalid upload basename: ${name}"; exit 1; }
            ASSETS+=("${DIST}/${name}")
          done
          for a in "${ASSETS[@]}"; do
            [[ -f "${a}" ]] || { echo "missing ${a}"; exit 1; }
          done
          # Existing releases are immutable; matching bytes make reruns a no-op.
          # Publish as a normal (non-prerelease) release so Control Plane button paths
          # can discover the target (AllowPrerelease defaults false). Artifact-pure E2E
          # then post-verifies; on FAIL ship the next patch — never retag.
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — verifying asset identity"
            bash scripts/assert-existing-release-matches-dist.sh "${TAG}" || {
              echo "Existing release assets differ from CI bytes; refuse silent overwrite"
              exit 1
            }
          else
            NOTES="${DIST}/NOTES.txt"
            [[ -f "${NOTES}" ]] || NOTES=""
            gh release create "${TAG}" "${ASSETS[@]}" \
              --title "Nyxveil Server ${TAG}" \
              ${NOTES:+--notes-file "${NOTES}"} \
              --verify-tag
          fi
          echo "Published ${TAG} from Server CI run ${CI_RUN_ID}"

  production-release-e2e:
    name: Production Release E2E (mandatory post-publish verify)
    needs: publish-candidate
    uses: ./.github/workflows/production-release-e2e.yml
    permissions:
      contents: read

  finalize-release:
    name: Record post-publish E2E PASS
    needs:
      - publish-candidate
      - production-release-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Confirm release remains production candidate after E2E
        env:
          TAG: ${{ needs.publish-candidate.outputs.release_tag }}
        run: |
          set -euo pipefail
          [[ -n "${TAG}" ]] || { echo "missing release tag"; exit 1; }
          echo "POST_PUBLISH_E2E_PASS tag=${TAG}"
